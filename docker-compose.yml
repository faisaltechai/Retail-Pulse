
services:
  retailpulse:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: retailpulse-app

    ports:
      - "8501:8501"

    env_file:
      - .env

    environment:
      APP_NAME: ${APP_NAME:-RetailPulse}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

    volumes:
      - ./logs:/app/logs

    restart: unless-stopped
